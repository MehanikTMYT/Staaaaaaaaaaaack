["Item merge settings"]
	#The maximum horizontal block distance over which dropped items attempt to merge with each other.
	#Default: 1.25, Minecraft default: 0.5
	# Default: 1.25
	# Range: 0.5 ~ 10.0
	maxMergeDistanceHorizontal = 1.25
	#The maximum vertical block distance over which dropped items attempt to merge with each other.
	#Default: 0.0, Minecraft default: 0.0
	# Default: 0.0
	# Range: 0.0 ~ 10.0
	maxMergeDistanceVertical = 0.0
	#Minimum entity ticks before merging; 0 disables deferred merge. Does not delay pickup.
	# Default: 0
	# Range: 0 ~ 1200
	mergeDelayTicks = 0
	#The maximum total item count of a merged pile; existing larger piles are preserved.
	#Default: 2147483647
	# Default: 2147483647
	# Range: > 1
	maxSize = 2147483647
	#Enable for merging non-stackable item.
	#Should be used with caution while playing with other mods.
	#Default: false
	enableForUnstackableItem = false
	#Set this "true" to make `itemList` a whitelist, it's a blacklist when set to "false".
	#Default: false
	itemListAsWhitelist = false
	#The list of items that should or should not exceed their original max stack size.
	#Or You can by using the item tag "#staaaaaaaaaaaack:blacklist" to blacklist the item.
	#e.g., ["minecraft:diamond_block", "minecraft:coal"]
	itemList = []
	#Set this "true" to make `dimensionList` a whitelist, it's a blacklist when set to "false".
	#Default: false
	dimensionListAsWhitelist = false
	#The list of dimension that should or should not make item exceed their original max stack size.
	#e.g., ["minecraft:overworld", "minecraft:the_nether"]
	dimensionList = []

[mixedAggregation]
	#Combine stable dropped items in a separate mixed-pile entity.
	enabled = true
	# Default: 2.0
	# Range: 0.25 ~ 8.0
	radius = 2.0
	# Default: 10
	# Range: 1 ~ 1200
	delayTicks = 10
	# Default: 64
	# Range: 2 ~ 256
	maxEntries = 64
	# Default: 4096
	# Range: 2 ~ 1048576
	maxTotalItems = 4096
	requireStablePosition = true
	#Keep ordinary ItemEntity near block entities, NPCs and detectable magnets.
	excludeAutomation = true
	#Unpack near incompatible processing, fluids, unsupported terrain or when disabled. Disabling aggregation always unpacks saved piles.
	fallbackToVanilla = true
	#Server-thread time budget for mixed aggregation per level per tick; pickup and machine actions are never queued.
	# Default: 8.0
	# Range: 0.1 ~ 50.0
	maxMergeMillisPerTick = 8.0
	# Default: 256
	# Range: 2 ~ 4096
	maxMergedEntriesPerTick = 256
