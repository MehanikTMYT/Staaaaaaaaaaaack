plugins { id 'net.neoforged.moddev' version '2.0.143' }
base { archivesName = 'staaaaaaaaaaaack-neoforge' }
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
neoForge {
    version = project.neo_version
    mods { staaaaaaaaaaaack { sourceSet sourceSets.main } }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}
jar {
    from('../LICENSE')
    manifest { attributes('Implementation-Version': project.version, 'Implementation-Vendor': 'frankV') }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); maxHeapSize = '512m' }

// The verification mod is present in development runs only, never in the release JAR.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    verificationImplementation.extendsFrom implementation
    verificationRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    addModdingDependenciesTo(sourceSets.verification)
    mods { stxck_verification { sourceSet sourceSets.verification } }
    runs {
        verifyServer {
            server()
            sourceSet = sourceSets.verification
            gameDirectory = file('run-verify')
            programArgument '--nogui'
            jvmArgument '-Xmx1G'
            systemProperty 'stxck.verify', 'true'
        }
    }
}
neoForge.runs {
    smokeServer {
        server()
        sourceSet = sourceSets.verification
        gameDirectory = file('run-smoke')
        programArgument '--nogui'
        jvmArgument '-Xmx768m'
        systemProperty 'stxck.clientServer', 'true'
    }
    verifyClient {
        client()
        sourceSet = sourceSets.verification
        gameDirectory = file('run-client')
        jvmArgument '-Xmx1G'
        systemProperty 'stxck.clientVerify', 'true'
        programArguments.addAll '--username', 'StxckTest', '--quickPlayMultiplayer', '127.0.0.1:25580', '--width', '854', '--height', '480'
    }
    persistenceServer {
        server()
        sourceSet = sourceSets.verification
        gameDirectory = file('run-persistence')
        programArgument '--nogui'
        jvmArgument '-Xmx768m'
        systemProperty 'stxck.persistence', 'true'
    }
}
neoForge.runs {
    vanillaBenchmark {
        server()
        sourceSet = sourceSets.verification
        loadedMods = [neoForge.mods.stxck_verification]
        gameDirectory = file('run-vanilla')
        programArgument '--nogui'
        jvmArgument '-Xmx1G'
        systemProperty 'stxck.vanillaBenchmark', 'true'
    }
}
tasks.register('exportVerificationLaunches') {
    dependsOn 'verificationClasses', 'prepareVerifyClientRun', 'prepareSmokeServerRun', 'preparePersistenceServerRun', 'prepareVanillaBenchmarkRun', 'prepareVerifyServerRun'
    doLast {
        def result = [:]
        ['runVerifyClient','runSmokeServer','runPersistenceServer','runVanillaBenchmark','runVerifyServer'].each { name ->
            def t = tasks.named(name).get()
            result[name] = [cwd: t.workingDir.absolutePath, argv: [t.executable] + t.allJvmArgs + ['-cp', sourceSets.verification.runtimeClasspath.asPath, t.mainClass.get()] + t.args]
        }
        file("$buildDir/verification-launch.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
    }
}
// A runtime assertion failure must not be reported as a successful Gradle task.
tasks.named('runVerifyServer') {
    doFirst { file('run-verify/verification-results.csv').text = 'RUNNING\n' }
    doLast {
        def result = file('run-verify/verification-results.csv').text
        if (!result.startsWith('FUNCTIONAL PASS') || result.contains('FAIL') ||
                result.readLines().count { it.startsWith('immediate,') || it.startsWith('deferred10,') } != 6) {
            throw new GradleException('Runtime verification failed or incomplete; inspect run-verify/verification-results.csv')
        }
    }
}
